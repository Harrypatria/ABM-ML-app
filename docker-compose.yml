version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VITE_APP_URL=http://localhost:3000
      - MODEL_PATH=models/model.pkl
      - MODEL_VERSION=1.0.0
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_URL=http://localhost:8000
